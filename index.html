<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>CutAI CAD/CAM v0.6</title>
  <link rel="manifest" href="manifest-v06.webmanifest">
  <link rel="stylesheet" href="styles-v06.css">
</head>
<body>
  <header class="topbar">
    <div><strong>CutAI CAD/CAM</strong> <span>v0.6</span></div>
    <div id="status">Bereit · mm</div>
  </header>

  <main class="app">
    <aside class="toolbar">
      <button class="tool active" data-tool="select">↖<small>Auswahl</small></button>
      <button class="tool" data-tool="line">╱<small>Linie</small></button>
      <button class="tool" data-tool="rect">▭<small>Rechteck</small></button>
      <button class="tool" data-tool="circle">○<small>Kreis</small></button>
      <button class="tool" data-tool="pan">✋<small>Pan</small></button>
      <button id="multiBtn">☷<small>Mehrfach</small></button>
      <button id="snapBtn" class="active">⌖<small>Fang an</small></button>
      <button id="duplicateBtn">⧉<small>Kopieren</small></button>
      <button id="undoBtn">↶<small>Zurück</small></button>
      <button id="redoBtn">↷<small>Vor</small></button>
      <button id="deleteBtn">⌫<small>Löschen</small></button>
    </aside>

    <section class="workspace-wrap">
      <section class="workspace">
        <svg id="cad" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet">
          <defs>
            <pattern id="minorGrid" width="10" height="10" patternUnits="userSpaceOnUse">
              <path d="M10 0 L0 0 0 10" class="grid minor"/>
            </pattern>
            <pattern id="majorGrid" width="100" height="100" patternUnits="userSpaceOnUse">
              <rect width="100" height="100" fill="url(#minorGrid)"/>
              <path d="M100 0 L0 0 0 100" class="grid major"/>
            </pattern>
          </defs>
          <rect id="gridBg" x="-5000" y="-5000" width="10000" height="10000" fill="url(#majorGrid)"/>
          <g id="geometry"></g>
          <g id="dimensions"></g>
          <g id="camMarkers"></g>
          <g id="preview"></g>
          <g id="snapLayer"></g>
        </svg>

        <div class="coords" id="coords">X 0.0 · Y 0.0 mm</div>

        <section class="properties hidden" id="properties">
          <div class="properties-head">
            <strong id="propTitle">Eigenschaften</strong>
            <button id="closeProperties">×</button>
          </div>

          <div id="propertyFields" class="property-fields"></div>

          <div class="move-box">
            <strong>Auswahl verschieben</strong>
            <div class="property-fields">
              <div class="field">
                <label>ΔX (mm)</label>
                <input id="moveX" type="number" step="0.1" value="0">
              </div>
              <div class="field">
                <label>ΔY (mm)</label>
                <input id="moveY" type="number" step="0.1" value="0">
              </div>
            </div>
            <div class="move-actions">
              <button data-nudge="-1,0">← 1</button>
              <button data-nudge="1,0">1 →</button>
              <button data-nudge="0,-1">↑ 1</button>
              <button data-nudge="0,1">1 ↓</button>
              <button id="moveApply">Versatz anwenden</button>
            </div>
          </div>

          <div id="camFields" class="cam-fields">
            <div class="field">
              <label>Technologie</label>
              <select id="technology">
                <option>Plasma</option>
                <option>Laser</option>
                <option>Autogen</option>
                <option>Markieren</option>
                <option>Bohren</option>
                <option>Keine</option>
              </select>
            </div>
            <div class="field">
              <label>Konturtyp</label>
              <select id="contourType">
                <option value="auto">Auto</option>
                <option value="outside">Außen</option>
                <option value="inside">Innen</option>
                <option value="mark">Markieren</option>
                <option value="drill">Bohren</option>
                <option value="none">Keine</option>
              </select>
            </div>
            <div class="field">
              <label>Schneidrichtung</label>
              <select id="direction">
                <option value="cw">Im Uhrzeigersinn</option>
                <option value="ccw">Gegen Uhrzeigersinn</option>
              </select>
            </div>
            <div class="field">
              <label>Schnittreihenfolge</label>
              <input id="cutOrder" type="number" min="1" step="1">
            </div>
            <div class="field">
              <label>Lead-In (mm)</label>
              <input id="leadIn" type="number" step="0.1">
            </div>
            <div class="field">
              <label>Lead-Out (mm)</label>
              <input id="leadOut" type="number" step="0.1">
            </div>
          </div>

          <div class="bevel-box">
            <div class="bevel-title">
              <strong>Fasenaggregat</strong>
              <label class="switch-row"><input id="bevelEnabled" type="checkbox"> aktiv</label>
            </div>
            <div class="property-fields">
              <div class="field"><label>Fasenwinkel (0–50°)</label><input id="bevelAngle" type="number" min="0" max="50" step="0.1" value="0"></div>
              <div class="field"><label>Fasenseite</label><select id="bevelSide"><option value="left">Links</option><option value="right">Rechts</option></select></div>
              <div class="field"><label>Fasenart</label><select id="bevelType"><option value="V">V-Fase</option><option value="Y">Y-Fase</option><option value="K">K/X-Fase</option><option value="custom">Benutzerdefiniert</option></select></div>
              <div class="field"><label>Steghöhe (mm)</label><input id="bevelLand" type="number" min="0" step="0.1" value="0"></div>
            </div>
            <div class="bevel-actions">
              <button id="bevelZeroBtn">Fase aus / 0°</button>
              <button id="bevel45Btn">45° setzen</button>
              <button id="bevel50Btn">50° setzen</button>
            </div>
          </div>

          <div id="edgeInfo" class="edge-info hidden"></div>

          <div class="prop-actions">
            <button id="setStartBtn">Startpunkt setzen</button>
            <button id="clearStartBtn">Startpunkt löschen</button>
            <button id="applyCamToSelection">CAM/Fase auf Auswahl übernehmen</button>
            <button id="applyProperties" class="apply-btn">Geometrie übernehmen</button>
          </div>
        </section>
      </section>

      <aside class="contour-panel">
        <div class="contour-head">
          <strong>Konturen</strong>
          <div><button id="selectAllBtn">Alle</button> <button id="clearSelectionBtn">Keine</button></div>
        </div>
        <div id="contourList" class="contour-list"></div>
      </aside>
    </section>
  </main>

  <section class="bottom-panel">
    <div class="quick-actions">
      <button id="newBtn">Neu</button>
      <button id="saveBtn">Projekt speichern</button>
      <label class="file-btn">Projekt laden<input id="loadInput" type="file" accept=".json,application/json"></label>
      <label class="file-btn">DXF importieren<input id="dxfInput" type="file" accept=".dxf,text/plain"></label>
      <label class="file-btn">SVG importieren<input id="svgInput" type="file" accept=".svg,image/svg+xml"></label>
      <button id="dxfBtn">DXF exportieren</button>
      <button id="camPlanBtn">CAM-Plan exportieren</button>
      <button id="autoCamBtn">CAM automatisch</button>
      <button id="fitBtn">Alles anzeigen</button>
      <button id="resetViewBtn">Ansicht 1:1</button>
    </div>
  </section>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
    }
    if ("caches" in window) caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
  </script>
  <script src="app-v06.js"></script>
</body>
</html>
